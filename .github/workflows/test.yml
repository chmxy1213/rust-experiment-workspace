name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Clink
        if: runner.os == 'Windows'
        run: |
            choco install clink-maintained -y --force
            # Add Clink to PATH for the current session since Choco only updates it for new sessions
            $env:Path = "C:\Program Files (x86)\clink;" + $env:Path
            # Enable clink for cmd globally (autorun)
            # & "C:\Program Files (x86)\clink\clink.exe" autorun install
            clink autorun install

      # Build all workspaces
      - name: Build
        run: cargo build --verbose

      # Run tests
      # This will pick up `remote-shell/tests/shell_integration_test.rs`
      # and since it is `#[cfg(windows)]`, it will execute on this runner.
      - name: Run tests
        run: cargo test --verbose --workspace
