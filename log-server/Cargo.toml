[package]
name = "log-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["multipart"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.2", features = ["multipart", "json"] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
axum-test = "18.7.0"
reqwest = { version = "0.13.2", features = ["multipart", "json"] }
tower = { version = "0.5.3", features = ["util"] }
